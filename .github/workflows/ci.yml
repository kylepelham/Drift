name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd engine/opencode

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  full:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install engine dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts --cwd engine/upstream
          bun install --frozen-lockfile --cwd engine/opencode

      - name: Engine tests
        run: bun run test:engine

      - name: Build engine
        run: bun run build:engine

      # The sidecars only change when the build script does, so a hit skips both the SDK and the build.
      - name: Cache speech recognizer
        id: whisper
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/whisper-cli*.exe
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/build-whisper.ts') }}

      - name: Install Vulkan SDK
        if: steps.whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "1.4.350.0"
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $args = @("--root", "C:\VulkanSDK\$version", "--accept-licenses", "--default-answer", "--confirm-command", "install")
          $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed with $($process.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build speech recognizer
        if: steps.whisper.outputs.cache-hit != 'true'
        run: bun run build:whisper

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Native unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
