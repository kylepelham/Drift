name: OpenCode update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: opencode-update
  cancel-in-progress: false

env:
  REVISION_FILE: engine/upstream.commit
  UPDATE_BRANCH: automation/opencode-update
  UPSTREAM_REF: refs/remotes/opencode-update/dev
  UPSTREAM_URL: https://github.com/sst/opencode.git

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: master

      - name: Check for an open update
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Fetch OpenCode dev
        if: steps.existing.outputs.number == ''
        run: git fetch --no-tags "$UPSTREAM_URL" "+dev:$UPSTREAM_REF"

      - name: Detect an update
        if: steps.existing.outputs.number == ''
        id: upstream
        run: |
          current="$(tr -d '\r\n' < "$REVISION_FILE")"
          if [[ ! "$current" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid OpenCode revision: $current" >&2
            exit 1
          fi
          latest="$(git rev-parse "$UPSTREAM_REF")"
          if ! git merge-base --is-ancestor "$current" "$latest"; then
            echo "OpenCode dev no longer descends from recorded split $current" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "has_update=$([[ "$current" != "$latest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Import OpenCode snapshot
        if: steps.existing.outputs.number == '' && steps.upstream.outputs.has_update == 'true'
        env:
          CURRENT: ${{ steps.upstream.outputs.current }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          git config user.name "Drift Automation"
          git config user.email "actions@users.noreply.github.com"
          git switch --create "$UPDATE_BRANCH"
          git rm -r --quiet engine/upstream
          git read-tree --prefix=engine/upstream/ -u "$UPSTREAM_REF^{tree}"
          printf '%s\n' "$LATEST" > "$REVISION_FILE"
          git add "$REVISION_FILE"
          git commit -m "chore: update vendored OpenCode to ${LATEST:0:10}"
          git update-ref -d "$UPSTREAM_REF"

      - name: Push update branch
        if: steps.existing.outputs.number == '' && steps.upstream.outputs.has_update == 'true'
        run: |
          remote="$(git ls-remote --heads origin "refs/heads/$UPDATE_BRANCH" | cut -f1)"
          if [[ -n "$remote" ]]; then
            git fetch --no-tags origin "+refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git push --force-with-lease="refs/heads/$UPDATE_BRANCH:$remote" origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

      - name: Open update pull request
        if: steps.existing.outputs.number == '' && steps.upstream.outputs.has_update == 'true'
        env:
          CURRENT: ${{ steps.upstream.outputs.current }}
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          body="$(printf '%s\n' \
            '## Summary' \
            '' \
            'Update the vendored OpenCode snapshot from dev.' \
            '' \
            "Previous revision: $CURRENT" \
            "New revision: $LATEST" \
            '' \
            '## Validation' \
            '' \
            "CI was dispatched for $UPDATE_BRANCH after this pull request was created." \
            '' \
            'This pull request is created for review and is never merged automatically.')"
          gh pr create --base master --head "$UPDATE_BRANCH" --title "Update vendored OpenCode" --body "$body"
          gh workflow run ci.yml --ref "$UPDATE_BRANCH"
