name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'engine/upstream/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun install --ignore-scripts --cwd engine/upstream
      - run: bun install --cwd engine/opencode
      - run: bun run build:engine
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bunx tauri build -c src-tauri/ci.conf.json
      - name: Write update manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $bundle = "src-tauri/target/release/bundle/nsis"
          $sig = Get-Content (Get-ChildItem "$bundle/*.sig").FullName -Raw
          $exe = (Get-ChildItem "$bundle/*-setup.exe").Name
          @{
            version = $version
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$exe"
              }
            }
          } | ConvertTo-Json -Depth 8 | Set-Content "$bundle/latest.json"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: true
