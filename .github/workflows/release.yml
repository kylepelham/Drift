name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  tag-policy:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.policy.outputs.commit }}
      published: ${{ steps.policy.outputs.published }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch release policy refs
        run: git fetch --force origin master:refs/remotes/origin/master "+refs/tags/*:refs/tags/*"

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Validate stable release tag
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/release-policy.ts check "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID"

  validation:
    needs: tag-policy
    if: needs.tag-policy.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful master CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.tag-policy.outputs.commit }}
        run: |
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&per_page=10" \
              --jq '.workflow_runs | map(select(.head_branch == "master")) | sort_by(.run_number) | last | if . then [.status, (.conclusion // ""), .html_url] | @tsv else "" end')"
            if [[ -z "$row" ]]; then
              echo "Waiting for master CI run for $COMMIT"
              sleep 15
              continue
            fi
            IFS=$'\t' read -r status conclusion url <<< "$row"
            if [[ "$status" != "completed" ]]; then
              echo "Waiting for $url ($status)"
              sleep 15
              continue
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "Master CI did not pass: $url ($conclusion)" >&2
              exit 1
            fi
            echo "Using successful master CI: $url"
            exit 0
          done
          echo "Timed out waiting for master CI for $COMMIT" >&2
          exit 1

  signed-artifacts:
    needs: tag-policy
    if: needs.tag-policy.outputs.published != 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.tag-policy.outputs.commit }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --ignore-scripts --cwd engine/upstream
          bun install --frozen-lockfile --cwd engine/opencode

      - name: Stamp release version
        run: bun scripts/release-policy.ts stamp "$env:GITHUB_REF_NAME"

      - name: Build engine
        run: bun run build:engine

      # Provides glslc for the GPU sidecar's shaders. Installed directly so the signing job gains
      # no third-party action.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.350.0"
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $args = @("--root", "C:\VulkanSDK\$version", "--accept-licenses", "--default-answer", "--confirm-command", "install")
          $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed with $($process.ExitCode)" }
          if (-not (Test-Path "C:\VulkanSDK\$version\Bin\glslc.exe")) { throw "glslc missing after install" }
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build speech recognizer
        run: bun run build:whisper

      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build -c src-tauri/ci.conf.json

      - name: Write update manifest
        shell: pwsh
        run: |
          $version = "${{ needs.tag-policy.outputs.version }}"
          $bundle = "src-tauri/target/release/bundle/nsis"
          $sigFile = Get-ChildItem "$bundle/*.sig" | Select-Object -First 1
          $exeFile = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          if (-not $sigFile -or -not $exeFile) {
            throw "Missing installer or signature under $bundle"
          }
          $sig = (Get-Content $sigFile.FullName -Raw).Trim()
          $exe = $exeFile.Name
          @{
            version = $version
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$exe"
              }
            }
          } | ConvertTo-Json -Depth 8 | Set-Content "$bundle/latest.json" -Encoding utf8

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_MODEL: openai/gpt-4.1
        run: bun scripts/release-notes.ts release-notes.md

      # Uploading a single directory keeps the artifact flat; multiple paths root it at their common ancestor.
      - name: Stage release artifacts
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Path release-artifacts | Out-Null
          Copy-Item "$bundle/*-setup.exe", "$bundle/*.sig", "$bundle/latest.json" release-artifacts
          Move-Item release-notes.md release-artifacts

      - name: Seal release notes and asset digests
        run: >-
          bun scripts/release-policy.ts seal release-artifacts/release-notes.md "$env:GITHUB_RUN_ID"
          "${{ needs.tag-policy.outputs.commit }}" "release-artifacts"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.tag-policy.outputs.commit }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [tag-policy, validation, signed-artifacts]
    if: needs.tag-policy.outputs.published != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.tag-policy.outputs.commit }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.tag-policy.outputs.commit }}
          path: release-artifacts

      - name: Fetch current release policy refs
        run: git fetch --force origin master:refs/remotes/origin/master "+refs/tags/*:refs/tags/*"

      - name: Revalidate complete release policy
        id: final-policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/release-policy.ts check "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA" "$env:GITHUB_RUN_ID"

      - name: Publish stable GitHub release
        if: steps.final-policy.outputs.published != 'true'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Drift ${{ github.ref_name }}
          body_path: release-artifacts/release-notes.md
          target_commitish: ${{ needs.tag-policy.outputs.commit }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*-setup.exe
            release-artifacts/*.sig
            release-artifacts/latest.json
