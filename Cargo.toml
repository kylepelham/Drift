[workspace]
resolver = "2"
members = ["crates/drift-engine", "crates/drift-engined", "crates/drift-migrate", "src-tauri"]

[workspace.dependencies]
axum = "0.8"
futures-util = "0.3"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Backtraces keep file and line; dropping full debug info cuts a rebuild of the engine tests by about a third.
[profile.dev]
debug = "line-tables-only"

[profile.release]
panic = "abort"
incremental = true
opt-level = "s"
strip = true
