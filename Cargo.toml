[workspace]
resolver = "2"
members = ["crates/drift-engine", "crates/drift-engined", "crates/drift-migrate", "src-tauri"]

# Every crate carries the app's version, so the engine reports what the shell is; the release stamp sets it.
[workspace.package]
version = "2.1.0"

[workspace.dependencies]
axum = "0.8"
futures-util = "0.3"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Backtraces keep file and line; dropping full debug info cuts a rebuild of the engine tests by about a third.
[profile.dev]
debug = "line-tables-only"

[profile.release]
panic = "abort"
incremental = true
opt-level = "s"
strip = true

# Crates opt in with `[lints] workspace = true`; thresholds are in clippy.toml.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "warn"
unnested_or_patterns = "warn"
