<!doctype html>
<html lang="en" data-theme="drift-charcoal">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" href="/src/assets/logo.svg" />
        <title>Drift</title>
        <script>
            try {
                const storedTheme = JSON.parse(localStorage.getItem("drift.theme") || "null");
                if (typeof storedTheme === "string") document.documentElement.dataset.theme = storedTheme;
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
