[package]
name = "drift-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true, features = ["ws"] }
bytes = "1"
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "rustls-native-certs", "stream"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"

[dev-dependencies]
# reqwest is built without a bundled provider; tests install ring themselves.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30"
