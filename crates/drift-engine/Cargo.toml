[package]
name = "drift-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true, features = ["ws"] }
bytes = "1"
futures-util = { workspace = true }
getrandom = { workspace = true }
# ripgrep's engine and gitignore-aware walker: search quality is the tool's whole value.
globset = "0.4"
grep = "0.4"
htmd = "0.5"
http = "1"
ignore = "0.4"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream", "http2"] }
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# Unified diffs shown to the model and the user after edits.
similar = "2"
tokio = { workspace = true, features = ["process", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# reqwest is built without a bundled provider; tests install ring themselves.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30"
