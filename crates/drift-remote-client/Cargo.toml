[package]
name = "drift-remote-client"
version.workspace = true
license.workspace = true
edition = "2024"

[lints]
workspace = true

[dependencies]
drift-pairing = { path = "../drift-pairing" }
# The local proxy a WebView talks to, and the HTTP upgrade it passes the event socket through; all already in the tree.
axum = { workspace = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = { workspace = true }
# Requests to a PC over TLS that trusts only that PC: its certificate authority, or its tunnel certificate's key.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
# Through the tunnel the PC holds a public certificate; Mozilla's roots, already in the tree, vouch for it.
webpki-root-certs = "1"
sha2 = "0.10"
getrandom = { workspace = true }
mime_guess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = "2"

[dev-dependencies]
# A stand-in PC: its certificate authority and leaf, as the desktop's gateway makes them.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }

# rustls-webpki is imported by its library name, webpki, which machete does not map back.
[package.metadata.cargo-machete]
ignored = ["rustls-webpki"]
