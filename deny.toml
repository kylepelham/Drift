# `cargo deny check`: known vulnerabilities, licences Drift can ship, and crates only from crates.io.
[advisories]
# Unmaintained crates deep in Tauri's Linux GTK stack have no replacement; flag only those Drift depends on directly.
unmaintained = "workspace"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# A Tauri app pulls several versions of common crates through its platform layers; duplicates are not refused.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
