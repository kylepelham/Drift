[package]
name = "drift-android"
version.workspace = true
license.workspace = true
edition = "2024"

[lints]
workspace = true

[lib]
name = "drift_android_lib"
# Android loads the cdylib; the rlib lets the tests and lints build it on any host.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
drift-pairing = { path = "../crates/drift-pairing" }
# The local proxy the WebView talks to, and the HTTP upgrade it passes the event socket through; all already in the tree.
axum = { workspace = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = { workspace = true }
# Requests to a PC over TLS that trusts only that PC: its certificate authority, or its tunnel certificate's key.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
# Through the tunnel the PC holds a public certificate; Mozilla's roots, already in the tree, vouch for it.
webpki-root-certs = "1"
sha2 = "0.10"
getrandom = { workspace = true }
# The desktop's own UI, served to the WebView by the proxy; embedded in debug builds too, since a phone has no source tree.
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = "2"

[dev-dependencies]
# A stand-in PC: its certificate authority and leaf, as the desktop's gateway makes them.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
