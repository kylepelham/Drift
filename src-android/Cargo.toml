[package]
name = "drift-android"
version.workspace = true
license.workspace = true
edition = "2024"

[lints]
workspace = true

[lib]
name = "drift_android_lib"
# Android loads the cdylib; the rlib lets the tests and lints build it on any host.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
drift-remote-client = { path = "../crates/drift-remote-client" }
getrandom = { workspace = true }
# The desktop's own UI, served to the WebView by the proxy; embedded in debug builds too, since a phone has no source tree.
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { workspace = true }
tokio = { workspace = true }
